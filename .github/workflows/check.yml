name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Each leg runs part of `make check` (or the installed-Pi gates) on its own
  # runner; `validate` below passes only when every leg passed.
  checks:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: static
            targets: syntax lint validate
          - suite: bats
            targets: test
          - suite: python
            targets: python-test
          - suite: pi-runtime
            targets: pi-security-gate pi-runtime-test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y bats parallel python3-jsonschema ripgrep shellcheck shfmt zsh
      - name: Install pinned yq
        shell: bash
        run: |
          set -euo pipefail
          source libexec/lib/artifacts.sh
          tools_dir="$RUNNER_TEMP/dotfiles-tools"
          install_pinned_yq "$tools_dir/yq"
          printf '%s\n' "$tools_dir" >>"$GITHUB_PATH"
      # Config/native-package tests consume the real SDK, not a private adapter.
      - name: Provision current Pi compatibility candidates
        shell: bash
        run: |
          set -euo pipefail
          package_prefix="$RUNNER_TEMP/pi-security-gate"
          # Test the permission evaluator version the installer pins, never @latest.
          permission_spec=$(jq -er '
            [.packages[] | if type == "object" then .source else . end
              | select(startswith("npm:@gotgenes/pi-permission-system@")) | ltrimstr("npm:")] | .[0]
          ' ai/pi/settings.json)
          MISE_SKIP_RESHIM=1 npm_config_cache="$RUNNER_TEMP/npm-cache" npm install \
            --global \
            --prefix "$package_prefix" \
            --ignore-scripts --legacy-peer-deps --no-audit --no-fund \
            "@earendil-works/pi-coding-agent@latest" \
            "$permission_spec" \
            "@gotgenes/pi-subagents@latest" \
            "@narumitw/pi-lsp@latest"
          source libexec/lib/pi-runtime.sh
          resolve_pi_runtime "" "$package_prefix/lib/node_modules/@earendil-works/pi-coding-agent"
          {
            printf 'PI_TEST_HOST_ROOT=%s\n' "$PI_RUNTIME_PACKAGE_ROOT"
            printf 'PI_TEST_PERMISSION_ROOT=%s\n' "$package_prefix/lib/node_modules/@gotgenes/pi-permission-system"
            printf 'PI_TEST_SUBAGENTS_ROOT=%s\n' "$package_prefix/lib/node_modules/@gotgenes/pi-subagents"
            printf 'PI_TEST_LSP_ROOT=%s\n' "$package_prefix/lib/node_modules/@narumitw/pi-lsp"
          } >>"$GITHUB_ENV"
          printf '%s\n' "$package_prefix/bin" >>"$GITHUB_PATH"
          node - "$PI_RUNTIME_PACKAGE_ROOT" "$package_prefix/lib/node_modules/@gotgenes/pi-permission-system" \
            "$package_prefix/lib/node_modules/@gotgenes/pi-subagents" "$package_prefix/lib/node_modules/@narumitw/pi-lsp" \
            >"$RUNNER_TEMP/pi-candidates.json" <<'JS'
          const { readFileSync } = require("node:fs");
          const metadata = root => {
            const { name, version } = JSON.parse(readFileSync(`${root}/package.json`, "utf8"));
            return { name, version };
          };
          const pi = metadata(process.argv[2]);
          const permission = metadata(process.argv[3]);
          const [major, minor] = pi.version.split(".").map(Number);
          if (!/^\d+\.\d+(?:\.|$)/.test(pi.version) || !Number.isSafeInteger(major) || !Number.isSafeInteger(minor)
            || major < 1 || (major === 1 && minor < 1)) throw new Error(`Pi SDK 1.1+ required; resolved ${pi.version}`);
          const subagents = metadata(process.argv[4]);
          const lsp = metadata(process.argv[5]);
          console.log(JSON.stringify({ pi, permission, subagents, lsp }, null, 2));
          JS
          cat "$RUNNER_TEMP/pi-candidates.json"
      # tests/pi_modes.bats checks the agent names the pinned skills package uses.
      - name: Check out the pinned skills package
        shell: bash
        run: |
          set -euo pipefail
          tag=$(sed -n 's/^SKILLS_TAG=//p' ai/claude/install.sh)
          git clone -q --depth 1 --branch "$tag" https://github.com/gambtho/gambtho-skills.git "$RUNNER_TEMP/gambtho-skills"
          printf 'SKILLS_PACKAGE_ROOT=%s\n' "$RUNNER_TEMP/gambtho-skills" >>"$GITHUB_ENV"
      - name: Run checks
        env:
          CHECK_TARGETS: ${{ matrix.targets }}
        # Word splitting is intended: one leg can run several Make targets.
        run: make $CHECK_TARGETS
      - name: Record tested Pi candidate identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-candidates-${{ matrix.suite }}
          path: ${{ runner.temp }}/pi-candidates.json

  validate:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every check leg to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          echo "checks: $CHECKS_RESULT"
          test "$CHECKS_RESULT" = success
