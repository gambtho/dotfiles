name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y bats python3-jsonschema ripgrep shellcheck shfmt zsh
      - name: Run checks
        run: make check
      - name: Validate the installed Pi permission pipeline
        shell: bash
        run: |
          set -euo pipefail
          source config/versions.env
          package_prefix="$RUNNER_TEMP/pi-security-gate"
          MISE_SKIP_RESHIM=1 npm_config_cache="$RUNNER_TEMP/npm-cache" npm install \
            --global \
            --prefix "$package_prefix" \
            --ignore-scripts \
            "@earendil-works/pi-coding-agent@$PI_VERSION" \
            "@gotgenes/pi-permission-system@$PI_PERMISSION_SYSTEM_VERSION"
          bin/validate-pi-security-runtime \
            --package-root "$package_prefix/lib/node_modules/@gotgenes/pi-permission-system" \
            --pi-package-root "$package_prefix/lib/node_modules/@earendil-works/pi-coding-agent"
